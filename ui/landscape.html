<!DOCTYPE html>
<html lang="ta" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>MPVK - LT Edition (Premium UI)</title>
    
    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://assets.lawtamil.in/scripts/nivoslider.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap');

    @font-face {
      font-family: 'Tamil039';
      src: url('https://cdn.lawtamil.in/font/Tamil039.woff2') format('woff2'),
           url('https://cdn.lawtamil.in/font/Tamil039.woff') format('woff');
      font-weight: bold; font-style: normal; font-display: swap; 
    }

    html, body {
        height: 100%; margin: 0; display: flex;
        justify-content: center; align-items: center; background-color: transparent;
    }

    .main-container {
      width: 1280px; height: 720px; position: relative; overflow: hidden; padding: 10px; box-sizing: border-box;
    }

    .main-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #19f radial-gradient(transparent, #02c); z-index: -1;
    }

    #breakingnews {
      text-align: center; background: #6d0102; border-radius: 15px; border: 2px solid #fff000; width: 940px; height: 50px; overflow: hidden; display: inline-block;
    }
    #adbreakingnews li a {
      font-family: 'Tamil039'; font-weight: bold; font-size: 26px; word-spacing: -8px; color: #fff; transition: all 1.5s ease-in-out; text-decoration: none; text-shadow: -1px -1px 1px #000, 1px 1px 1px #fff;
    }
    #adbreakingnews ul, #adbreakingnews li { list-style: none; margin: 0; padding: 0px; }
    .af_news { height: 0px; overflow: hidden; transition: height 0.5s ease-in-out; }
    .af_news.active { height: 400px; }

    #top-case-overlay {
      position: absolute; top: 8px; left: 11px; width: 69.6%; height: 7.5%;
      border-radius: 15px; border: 2px solid #fff000; background: linear-gradient(135deg, #c60203 0%, #6d0102 100%);
      z-index: 50; display: flex; align-items: center; justify-content: center; gap: 15px; 
      opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0.5s; overflow: hidden;
    }
    #top-case-overlay.show-case { opacity: 1; visibility: visible; }
    #top-case-year { color: #e1b941; font-family: Arial, sans-serif; font-size: 32px; font-weight: 900; }
    #top-case-name {
      color: #ffffff; font-family: 'Tamil039', sans-serif !important; font-size: 26px; font-weight: bold; word-spacing: -8px; text-shadow: -1px -1px 1px #000, 1px 1px 1px #fff; padding-top: 8px;
    }

    .ai-fixed-frame {
      position: absolute; top: 41.6%; left: 50%; transform: translate(-50%, -50%);
      width: 98%; height: 63.3%; box-shadow: inset 0 0 0 2px #fff; border-radius: 15px; overflow: hidden; z-index: 100; background: transparent; 
      transition: all 0.5s ease;
    }
    .news-wrapper { display: flex; width: 100%; height: 100%; align-items: center; cursor: pointer; transition: all 0.5s ease; }

    .text-section {
        flex: 6.5; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
        padding: 0 50px; box-sizing: border-box; position: relative; overflow: hidden; transition: all 0.5s ease;
    }

    /* THEME BG COVER */
    #theme-bg-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #c60203 0%, #6d0102 100%); z-index: 1; 
        opacity: 1; visibility: visible; transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #theme-bg-layer.hide-bg { opacity: 0; visibility: hidden; }

    /* LOCATION TICKER STYLES */
    #location-ticker-container {
        position: absolute; top: 25px; left: 30px; z-index: 150;
        display: flex; align-items: center; opacity: 0; visibility: hidden;
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #location-ticker-container.active { opacity: 1; visibility: visible; }
    .loc-icon {
        font-size: 26px; color: #ff3333; margin-right: 15px;
        filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.9)); animation: pulse-pin 1.5s infinite;
        position: relative; top: -6px;
    }
    @keyframes pulse-pin { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    #location-ticker-wrapper { height: 40px; overflow: hidden; display: flex; align-items: center; }
    #location-ticker-wrapper ul { list-style: none; margin: 0; padding: 0; }
    .loc_news { height: 0; overflow: hidden; transition: height 0.5s ease; display: flex; align-items: center; }
    .loc_news.active { height: 45px; }
    .loc_news a {
        color: #ffffff; text-decoration: none; font-family: 'Tamil039', sans-serif; font-size: 24px; font-weight: bold;
        text-shadow: 0px 2px 5px rgba(0,0,0,0.9), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        line-height: 1.2; padding-top: 3px; 
    }

    /* 🟢 OBS Local Video Layers 🟢 */
    #local-video-layer, #local-video-layer-buffer, #local-img-layer, #local-video-layer-2 { 
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        object-fit: cover; z-index: 101; opacity: 0; visibility: hidden; 
        object-position: 50% 50%; transform-origin: 50% 50%; transform: scale(1);
        transition: opacity 0.5s ease-in-out, visibility 0.5s, object-position 0.5s ease, transform-origin 0.5s ease, transform 0.5s ease; 
    }
    #local-video-layer-2 { z-index: 102; }
    
    #local-slider-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 102; opacity: 0; visibility: hidden; transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.5s; overflow: hidden; }
    .nivoSlider { position: relative; width: 100% !important; height: 100% !important; overflow: hidden; }
    .nivoSlider > a > img, .nivoSlider > img, .nivo-main-image { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; object-fit: cover; }
    .nivo-slice, .nivo-box { display: block; position: absolute; z-index: 5; overflow: hidden; }
    .nivo-slice img, .nivo-box img { display: block; position: absolute; max-width: none !important; height: 100% !important; object-fit: cover; }
    .nivo-caption, .nivo-directionNav a, .nivo-controlNav { display: none !important; }

    #webrtc-iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 103; border: none; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.5s; background: transparent; }

    #layer-text-slider {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(109, 1, 2, 0.95); display: flex; justify-content: center; align-items: center;
        z-index: 105; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.5s ease;
    }
    #layer-text-slider.active { opacity: 1; visibility: visible; pointer-events: auto; }
    
    .news-wrapper-native { width: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none; }
    .news-box-native { background-color: #c60203; opacity: 0.95; color: #ffffff; padding: 20px 30px; width: auto; max-width: 80%; overflow: hidden; border: 2px solid #fff; border-radius: 15px; box-shadow: 0px 5px 20px rgba(0,0,0,0.8); box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
    
    .cticker_af_news { max-height: 0px; opacity: 0; overflow: hidden; transition: max-height 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease; display: flex; align-items: center; justify-content: center; }
    .cticker_af_news.active { max-height: 500px; opacity: 1; }
    #cticker-feed-wrapper ul, #cticker-feed-wrapper li { list-style: none; margin: 0; padding: 0px; width: 100%; }
    #cticker-feed-wrapper li a { text-decoration: none; color: #ffffff; font-family: 'Tamil039', sans-serif; font-size: 26px; font-weight: bold; line-height: 1.8; text-shadow: 2px 2px 5px rgba(0,0,0,0.9); display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }

    .output { position: relative; z-index: 10; font-family: 'Tamil039', sans-serif; font-size: 26px; color: #ffc16f; opacity: 0.9; line-height: 1.9; font-weight: bold; text-align: center; word-spacing: -7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-height: calc(2 * 1.9em); animation: tv-flash 1.5s linear infinite alternate; text-shadow: 0px 6px 15px rgba(0,0,0,0.9); padding: 20px; }
    #mermaid-container { margin-top: 33px; width: 100%; height: 230px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #mermaid-container:empty { display: none; }
    @keyframes drawChartReveal { 0% { clip-path: inset(0 100% 0 0); opacity: 0.5; } 100% { clip-path: inset(0 0 0 0); opacity: 1; } }
    #mermaid-container svg { max-width: 100% !important; max-height: 100% !important; background: transparent !important; filter: drop-shadow(0px 5px 12px rgba(0,0,0,0.9)); animation: drawChartReveal 1.5s ease-in-out forwards; }
    .mermaid * { font-family: 'Tamil039', sans-serif !important; }

    .anim-section { 
        flex: 3.5; height: 100%; margin-left: -15px; 
        background: linear-gradient(269deg, #bd931b 0%, #6d0102 100%);
        border-left: 2px solid rgba(255,255,255,0.2); position: relative; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box; z-index: 30; overflow: hidden;
        transition: all 0.5s ease;
    }

    .bg-video-logo {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 85%; height: 85%; object-fit: contain; z-index: 1; pointer-events: none;
    }
    #justice-glow { position: absolute; top: 33%; left: 66%; width: 60px; height: 110px; border-radius: 0 100% 0 100%; transform: translate(-50%, -50%) rotate(15deg); background: radial-gradient(ellipse, rgba(255, 215, 0, 0.9) 0%, rgba(255, 172, 51, 0.5) 60%, transparent 80%); filter: blur(8px); z-index: 5; opacity: 0; pointer-events: none; transition: opacity 0.03s ease-out; }
    #visualizer { position: absolute; top: 48.2%; left: 53%; transform: translate(-50%, -50%); width: 160px; height: 160px; z-index: 4; pointer-events: none; }
    .v-bar { position: absolute; bottom: 50%; left: 50%; width: 4px; height: 15px; background: linear-gradient(0deg, #fff 0%, #ffc16f 100%); clip-path: polygon(50% 0%, 100% 100%, 0% 100%); margin-left: -2px; transform-origin: bottom center; filter: drop-shadow(0 0 5px rgba(255, 172, 51, 0.8)); }
    #webrtc-visualizer-iframe { position: absolute; top: 48.2%; left: 53%; transform: translate(-50%, -50%); width: 350px; height: 350px; z-index: 7; border: none; background: transparent; pointer-events: none; overflow: hidden; }

    .ticker { background: linear-gradient(90deg,#0000 33%,rgba(255,255,255,0.3) 50%,#0000 66%) #c60203; background-image: url('https://host.rtbs.in/media/tv-bg.gif'); background-size:100% 100%; width: 100%; height: 50px; overflow: hidden; position: absolute; bottom: 0; left: 0; white-space: nowrap; z-index: 10; }
    .breaking-scroll,.breaking-scroll a:link { text-decoration: none; height: 47px; color:#FFF; font-family: 'Tamil039'; font-weight: bold; font-size:26px; text-shadow: -1px -1px 1px #fff, 1px 1px 1px #000; word-spacing: -5px; margin-top: 2px; }
    .ticker .stock-info { position: absolute; top: 0; right: 0; width: 260px; height: 50px; }
    .breaking_news { float:right; width:100%; font-family: "Agdasima", sans-serif; font-size: 40px; margin-top: 0px; text-shadow: -1px -1px 1px #fff, 1px 1px 1px #000; letter-spacing: 2px; }
    .label { float:right; padding:1.4px 7px 7px 10px; background:linear-gradient(135deg, #c60203 0%, #6d0102 100%); color:#FFF; font-weight: bold; text-transform: uppercase; }
    .ripple { position: relative; overflow: hidden; }
    .ripple:after { content: ''; position: absolute; top: 50%; left: 50%; width: 9px; height: 5px; background: rgba(255, 255, 255, .5); opacity: 0; border-radius: 100%; transform: scale(1, 1) translate(-50%); transform-origin: 50% 50%; animation: ripple 1.5s ease-out infinite; }
    .lower-ticker { margin-top: 475px; z-index: 10; position: relative; }

    #rtcslive-widget { font-family: 'Tamil039', sans-serif; font-weight: bold; overflow: hidden; height: 120px; background: #6d0102; border-radius: 15px 30px; border: 2px solid #fff000; text-align: center; position: relative; display: flex; align-items: center;  justify-content: center; }
    #bottom-feed-wrapper { width: 100%; padding: 0 10px; }
    #bottom-feed-wrapper ul, #bottom-feed-wrapper li { list-style: none; margin: 0; padding: 0px; }
    .bottom_af_news { height: 0px; overflow: hidden; transition: height 0.6s cubic-bezier(0.25, 1, 0.5, 1); display: flex; align-items: center; justify-content: center; }
    .bottom_af_news.active { height: 120px; }
    #bottom-feed-wrapper li a { text-decoration: none; color: #ffffff; font-size: 28px; line-height: 1.8; word-spacing: -10px; text-shadow: 2px 2px 5px #000; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; animation: tv-flash 1.5s linear infinite alternate; padding-top: 10px; transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1); }

    .round-image { width: 45px; height: 45px; border-radius: 50%; z-index: 1; position: relative; }
    .pulse-container { position: relative; }
    .pulse1, .pulse2, .pulse3 { position: absolute; width: 45px; height: 45px; border-radius: 50%; z-index: 0; background: #fff; animation: pulse 3s infinite; }
    .pulse2 { animation-delay: 1s; } .pulse3 { animation-delay: 2s; }
    .social-logo { margin-right: 10px; }

    #social-banner-overlay { position: absolute; bottom: -1px; left: -23px; width: 103.5%; height: 125px; display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0.5s ease; }
    #social-banner-overlay.show-social { opacity: 1; visibility: visible; }
    #base { position: relative; margin: auto; width: 96% !important; height: 120px !important; overflow: hidden; border-radius: 15px 30px; box-shadow: 0px 10px 30px rgba(0,0,0,0.8); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #00478F; border: 2px solid #e1b941; }
    .bg-navy { position: absolute; width: 100%; height: 100%; background: linear-gradient(135deg, #8e0203 0%, #b68619 100%); }
    .left-block-container { display: flex; align-items: center; position: absolute; top: 15px; left: -50%; z-index: 1; animation: leftBlockAnim 10s ease-in-out infinite; }
    .scale-icon { font-size: 70px; margin-left: 0px; margin-bottom: 10px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.4)); display: inline-block; animation: flipAction 4s ease-in-out infinite; }
    .text-group { display: flex; flex-direction: column; align-items: flex-start; margin-top: 10px; margin-left: 0px;  }
    .title { font-family: 'Tamil039', sans-serif; font-size: 34px; font-weight: bold; color: #ffc16f; text-shadow: 2px 2px 5px rgba(0,0,0,0.6); line-height: 1; }
    .tagline { font-family: 'Tamil039', sans-serif; color: #ffffff; font-size: 20px; font-weight: bold; letter-spacing: 1px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); margin-top: 2px; margin-left: 12px; }
    .soc { position: absolute; top: 35px; font-size: 50px; z-index: 3; filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.5)); }
    .yt { color: #ff0000; animation: soc1 10s ease-in-out infinite; }
    .fb { color: #1877F2; background: white; border-radius: 50%; font-size: 50px; animation: soc2 10s ease-in-out infinite; }
    .ig { color: #E1306C; animation: soc3 10s ease-in-out infinite; }
    .tw-x { color: #ffffff; animation: soc4 10s ease-in-out infinite; } 
    .h2-ribbon { position: absolute; height: 600px; width: 700px;  top: -150px; background: linear-gradient(45deg, #e6a955, #ffc16f, #e6a955); transform: rotate(15deg); z-index: 6; animation: ribbon 10s ease-in-out infinite; box-shadow: -15px 0 25px rgba(0,0,0,0.6); }
    .ribbon-text-container { position: absolute; text-align: center; top: 195px; width: 700px; margin-left: -135px; transform: rotate(-15deg); z-index: 6; }
    .h1-main { font-family: 'Montserrat', sans-serif; color: #00478F; font-size: 34px; font-weight: 900; line-height: 1; letter-spacing: 1px; }
    .h1-sub { font-family: 'Montserrat', sans-serif; color: #ffffff; font-size: 36px; font-weight: 800; margin-top: 6px; letter-spacing: 0.5px; text-shadow: -1px -1px 0 #001f4d,  1px -1px 0 #001f4d, -1px  1px 0 #001f4d, 1px  1px 0 #001f4d, 3px  3px 6px rgba(0,0,0,0.7); }
    .slid1 { position: absolute; background-color: rgba(255, 255, 255, 0.15); height: 400px; width: 60px; top: -100px; transform: rotate(20deg); z-index: 2; animation: flash 10s ease infinite; }

    #ts-transition-overlay { 
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        z-index: 999999; pointer-events: none; 
        opacity: 0; visibility: hidden; 
        transition: opacity 0.2s ease, visibility 0.2s;
    }
    #ts-transition-overlay.active {
        opacity: 1; visibility: visible;
    }
    #breaking-gif-img {
        width: 100%; height: 100%; object-fit: cover; 
    }

    @keyframes bgSweep { 0% { left: 100%; } 100% { left: -100%; } }
    @keyframes flipScale { 0%, 85% { transform: rotateY(0deg); } 90% { transform: rotateY(180deg); } 100% { transform: rotateY(360deg); } }
    @keyframes ripple { 0% { transform: scale(0, 0); opacity: 1; } 20% { transform: scale(25, 25); opacity: 1; } 100% { opacity: 0; transform: scale(40, 40); } }
    @keyframes tv-flash { 0%, 80% { color: #ffffff; } 90% { color: #ff0000; } 100% { color: #ffffff; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes flipAction { 0% { transform: perspective(400px) rotateY(0deg); } 40% { transform: perspective(400px) rotateY(180deg); }  80% { transform: perspective(400px) rotateY(360deg); } 100% { transform: perspective(400px) rotateY(360deg); } }
    @keyframes leftBlockAnim { 0% { left: -50%; } 12% { left: 2%; } 85% { left: 2%; } 95% { left: -50%; } 100% { left: -50%; } }
    @keyframes soc1 { 0% { left: 110%; } 16% { left: 35%; } 85% { left: 35%; } 96% { left: 110%; } 100% { left: 110%; } }
    @keyframes soc2 { 0% { left: 110%; } 18% { left: 42%; } 85% { left: 42%; } 97% { left: 110%; } 100% { left: 110%; } }
    @keyframes soc3 { 0% { left: 110%; } 20% { left: 49%; } 85% { left: 49%; } 98% { left: 110%; } 100% { left: 110%; } }
    @keyframes soc4 { 0% { left: 110%; } 22% { left: 56%; } 85% { left: 56%; } 99% { left: 110%; } 100% { left: 110%; } }
    @keyframes ribbon { 0% { left: 120%; } 15% { left: 63%; }  85% { left: 63%; } 100% { left: 120%; } }
    @keyframes flash { 0% { left: -10%; } 10% { left: 120%; } 100% { left: 120%; } }

    /* DEDICATED STINGER TRANSITION */
    #stinger-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; pointer-events: none; overflow: hidden; visibility: hidden; }
    .stinger-left, .stinger-right { position: absolute; top: 0; width: 50%; height: 100%; background: linear-gradient(135deg, #c60203 0%, #6d0102 100%); box-shadow: 0 0 50px rgba(0,0,0,0.9); transform: translateX(0); }
    .stinger-left { left: 0; border-right: 4px solid #ffc16f; }
    .stinger-right { right: 0; border-left: 4px solid #ffc16f; }
    #stinger-overlay.active .stinger-left { transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.77, 0, 0.175, 1); }
    #stinger-overlay.active .stinger-right { transform: translateX(100%); transition: transform 0.25s cubic-bezier(0.77, 0, 0.175, 1); }

    /* ========================================================
       🟢 EXPAND MODE CSS LOGIC (TRIGGERED BY EXPAND BUTTON) 🟢
       ======================================================== */
    .expanded-mode .ai-fixed-frame {
        top: 0 !important; left: 0 !important; transform: none !important;
        width: 100% !important; height: calc(100% - 50px) !important; /* Ticker வரை விரியும் */
        border-radius: 0 !important; box-shadow: none !important; border: none !important;
        z-index: 100 !important;
    }
    .expanded-mode .news-wrapper {
        align-items: stretch !important;
    }
    .expanded-mode .text-section {
        flex: 1 1 100% !important; padding: 0 !important;
    }
    
    /* 🟢 லோகோ அளவு 200px ஆகப் பெரிதாக்கப்பட்டுள்ளது */
    .expanded-mode .anim-section {
        position: absolute !important; top: 10px !important; right: 10px !important;
        width: 200px !important; height: 200px !important; flex: none !important;
        background: transparent !important; border: none !important; margin: 0 !important;
        z-index: 200 !important; padding: 0 !important;
    }
    .expanded-mode .bg-video-logo {
        object-fit: contain !important;
    }
    .expanded-mode .anim-section #justice-glow,
    .expanded-mode .anim-section #visualizer,
    .expanded-mode .anim-section #webrtc-visualizer-iframe {
        display: none !important;
    }

    /* மற்ற தேவையற்ற லேயர்களை மறைத்தல் */
    .expanded-mode .ticker-top,
    .expanded-mode .lower-ticker,
    .expanded-mode #output,
    .expanded-mode #mermaid-container,
    .expanded-mode #layer-text-slider,
    .expanded-mode #theme-bg-layer,
    .expanded-mode #top-case-overlay,
    .expanded-mode #ts-transition-overlay {
        display: none !important;
    }
    
    /* 🟢 Ticker எந்தப் பாதிப்பும் இல்லாமல் அசலாக இருக்க */
    .expanded-mode .ticker {
        display: block !important;
        width: 100% !important;
        z-index: 200 !important; 
    }

     /* ========================================================
       📱 9:16 PORTRAIT (MOBILE/SHORTS) MEDIA QUERY 
       ======================================================== */
    @media (orientation: portrait), (max-aspect-ratio: 9/16) {
        
        .main-container { width: 720px !important; height: 1280px !important; }

        function updateTopTicker(textData) {

            newsContainer.innerHTML = html;

            let af_now = 0; const af_boxes = document.querySelectorAll(".af_news");
            if (af_boxes.length > 0) {
                af_boxes[af_now].classList.add("active");

            }
        }

        let validSliderImages = [];

        function loadAndInitSlider() {
            if (sliderInitializing) return;
            sliderInitializing = true;
            
            fetch("http://127.0.0.1:3000/api/slider_images")
                .then(res => res.json())

                        prevImagesJSON = JSON.stringify(data.images);

                        initNivoLocalSlider();

                    console.error("Slider fetch failed:", err);

        function initNivoLocalSlider() {
            let sliderContainer = $("#local-slider-layer"); 
            sliderContainer.removeData('nivoslider');

            validSliderImages.forEach(url => {

                pauseTime: 5000, 
                animSpeed: 800, 
                directionNav: false,

        setInterval(() => {
            if(isSliderVisible) {

                    .then(res => res.json())
                    .then(data => {
                        if (data.images && data.images.length > 0) {

    <script type="text/javascript">
        const MAX_POSTS = 99; const BULLET_CHAR = "&#x2727;";
        function RecentPostsScrollerv2(json) {
            try {
                let headlines = "";
                for (let i = 0; i < MAX_POSTS; i++) {
                    const post = json.feed.entry[i]; if (!post) break;
                    let postURL = ""; for (let j = 0; j < post.link.length; j++) { if (post.link[j].rel === 'alternate') { postURL = post.link[j].href; break; } }
                    headlines += `<b>${BULLET_CHAR}</b> <a target="_blank" href="${postURL}">${post.title.$t}</a>&nbsp;&nbsp;`;
                }
                const fullText = headlines.repeat(4);
                const marqueeHTML = `<marquee behavior="scroll" onmouseover="this.stop();" onmouseout="this.start();" width="100%" direction="left">${fullText}</marquee>`;
                document.getElementById("ticker-content").innerHTML = marqueeHTML;
            } catch (e) { console.error("Ticker Load Error:", e); }
        }
    </script>

   <!-- SSE, MEDIA CONTROLS & VISUALIZER LOGIC -->
   <script>
        const myAudio = document.getElementById("bgAudio");

        const topCaseOverlay = document.getElementById("top-case-overlay");

        if (v2Element) { v2Element.style.opacity = "0"; v2Element.style.visibility = "hidden"; }
        
        let isStarted = false; const ARC_RADIUS = 30; let analyser, dataArray, vBars = []; let audioCtx, source; let isAudioSetup = false; 
        
        let currentVideoPlaylist = []; 
        let currentVideoIndex = 0; 
        let isSingleLoop = false;
        let activePlayer = 1;
        let isMediaMuted = false;
        
        let isTextHidden = false, isLocalMediaVisible = false, isSliderVisible = false, isWebrtcVisible = false, isCTickerVisible = false, isVideo2Visible = false;

        let panX = 50;

        function updateMediaTransform() {

            elements.forEach(id => {

        let isTSVisible = true;

            const tsOverlay = document.getElementById("ts-transition-overlay");

            tsImg.src = "http://127.0.0.1:3000/Gif/breaking.gif?t=" + new Date().getTime();

            if (breakingGifTimeout) clearTimeout(breakingGifTimeout);
            breakingGifTimeout = setTimeout(() => {

        function startBreakingGifLoop() {
            if (breakingGifInterval) clearInterval(breakingGifInterval);
            triggerBreakingGif(); 
            breakingGifInterval = setInterval(triggerBreakingGif, 30000); 
        }

        window.addEventListener('load', startBreakingGifLoop);


        function executeWithStinger(callback) {
            const stinger = document.getElementById("stinger-overlay");
            if (stinger) {
                stinger.classList.remove("active");
                stinger.style.visibility = 'visible';
                if (callback) callback(); 
                setTimeout(() => { stinger.classList.add("active"); }, 30);
                setTimeout(() => { stinger.style.visibility = 'hidden'; }, 300); 
            } else {
                if (callback) callback();
            }
        }

        function playNextVideoInList() {
            const v1 = document.getElementById("local-video-layer");
            const v2 = document.getElementById("local-video-layer-buffer");
            const i = document.getElementById("local-img-layer");
            
            if (currentVideoIndex < currentVideoPlaylist.length) {
                let fileName = currentVideoPlaylist[currentVideoIndex];
                let isImg = fileName.toLowerCase().match(/\.(gif|png|jpg|jpeg)$/);
                let folder = isImg ? "Gif" : "Videos";
                let fileUrl = `http://127.0.0.1:3000/${folder}/${fileName}`;
                
                let nextV = activePlayer === 1 ? v2 : v1;
                let currV = activePlayer === 1 ? v1 : v2;

                const executePlay = () => {
                    turnOffOthers('media');
                    isLocalMediaVisible = true;
                    if (i) { i.style.opacity = "0"; i.style.visibility = "hidden"; }
                    
                    activePlayer = activePlayer === 1 ? 2 : 1;
                    nextV.style.visibility = "visible"; 
                    nextV.style.opacity = "1";
                    nextV.play().catch(e => console.log(e));

                    currV.style.opacity = "0";
                    currV.style.visibility = "hidden";
                    currV.pause();

                    preloadNextVideo();
                };

                if (isImg) {
                    if (i) i.src = fileUrl;
                    const playImg = () => {
                        turnOffOthers('media');
                        isLocalMediaVisible = true;
                        currV.style.opacity = "0"; currV.style.visibility = "hidden"; currV.pause();
                        nextV.style.opacity = "0"; nextV.style.visibility = "hidden"; nextV.pause();
                        if (i) { i.style.visibility = "visible"; i.style.opacity = "1"; }
                        preloadNextVideo();
                    };
                    i.onload = () => { i.onload = null; executeWithStinger(playImg); };
                    setTimeout(() => { if (i.onload) { i.onload = null; executeWithStinger(playImg); } }, 500);
                } else {
                    if (nextV.src && nextV.src.indexOf(encodeURIComponent(fileName)) !== -1 && nextV.readyState >= 3) {
                        executeWithStinger(executePlay);
                    } else {
                        nextV.loop = isSingleLoop; 
                        nextV.muted = isMediaMuted;
                        nextV.src = fileUrl;
                        nextV.load();
                        
                        const handlePlayReady = () => {
                            nextV.oncanplay = null; 
                            executeWithStinger(executePlay);
                        };
                        
                        nextV.oncanplay = handlePlayReady;
                        setTimeout(() => { if(nextV.oncanplay) handlePlayReady(); }, 1500);
                    }
                }
            } else {
                currentVideoPlaylist = []; isLocalMediaVisible = false;
                const v1 = document.getElementById("local-video-layer");
                const v2 = document.getElementById("local-video-layer-buffer");
                if (v1) { v1.style.opacity = "0"; setTimeout(() => { if(!isLocalMediaVisible){ v1.style.visibility = "hidden"; v1.pause(); v1.src = ""; } }, 500); }
                if (v2) { v2.style.opacity = "0"; setTimeout(() => { if(!isLocalMediaVisible){ v2.style.visibility = "hidden"; v2.pause(); v2.src = ""; } }, 500); }

                if (!isImg) {
                    let fileUrl = `http://127.0.0.1:3000/Videos/${nextFileName}`;
                    let preloadV = activePlayer === 1 ? document.getElementById("local-video-layer-buffer") : document.getElementById("local-video-layer");
                    preloadV.loop = isSingleLoop;
                    preloadV.muted = isMediaMuted;
                    
                    if (!preloadV.src || preloadV.src.indexOf(encodeURIComponent(nextFileName)) === -1) {
                        preloadV.src = fileUrl;
                        preloadV.load();
                    }
                }
            }
        }

        const onVideoEnded = function() {
            if (currentVideoPlaylist && currentVideoPlaylist.length > 0 && !isSingleLoop) { 
                currentVideoIndex++; playNextVideoInList(); 
            }
        };
        const localVideoElement1 = document.getElementById("local-video-layer");
        const localVideoElement2 = document.getElementById("local-video-layer-buffer");
        if (localVideoElement1) localVideoElement1.addEventListener('ended', onVideoEnded);
        if (localVideoElement2) localVideoElement2.addEventListener('ended', onVideoEnded);

        function turnOffOthers(currentOn) {
            if (currentOn !== 'media' && isLocalMediaVisible) {
                isLocalMediaVisible = false; currentVideoPlaylist = []; 
                const v1 = document.getElementById("local-video-layer"); 
                const v2 = document.getElementById("local-video-layer-buffer"); 
                const i = document.getElementById("local-img-layer");
                if (v1) { v1.style.opacity = "0"; setTimeout(() => { if (!isLocalMediaVisible) { v1.style.visibility = "hidden"; v1.pause(); } }, 500); }
                if (v2) { v2.style.opacity = "0"; setTimeout(() => { if (!isLocalMediaVisible) { v2.style.visibility = "hidden"; v2.pause(); } }, 500); }
                if (i) { i.style.opacity = "0"; setTimeout(() => { if (!isLocalMediaVisible) { i.style.visibility = "hidden"; i.src = ""; } }, 500); }
            }
            if (currentOn !== 'video2' && isVideo2Visible) {
                isVideo2Visible = false;
                if (v2Element) { v2Element.style.opacity = "0"; setTimeout(() => { if (!isVideo2Visible) { v2Element.style.visibility = "hidden"; v2Element.pause(); } }, 500); }
            }
            if (currentOn !== 'slider' && isSliderVisible) {
                isSliderVisible = false;
                if (localSliderLayer) { localSliderLayer.style.visibility = "hidden"; localSliderLayer.style.opacity = "0"; }
            }
            if (currentOn !== 'webrtc' && isWebrtcVisible) {
                isWebrtcVisible = false;
                if (webrtcIframe) { webrtcIframe.style.visibility = "hidden"; webrtcIframe.style.opacity = "0"; webrtcIframe.style.pointerEvents = "none"; }
            }
            if (currentOn !== 'cticker' && isCTickerVisible) {
                isCTickerVisible = false;
                const cTickerLayer = document.getElementById("layer-text-slider");
                if (cTickerLayer) cTickerLayer.classList.remove("active");
            }
            if (currentOn !== 'text' && !isTextHidden) {
                isTextHidden = true; 
                if (outputDiv) outputDiv.style.opacity = "0"; 
                if (mermaidDiv) mermaidDiv.style.opacity = "0"; 
                if (topCaseOverlay) topCaseOverlay.style.opacity = "0";
            }
        }

        let evtSource;
        function connectSSE() {
            evtSource = new EventSource('http://127.0.0.1:3000/events');
            evtSource.onmessage = function(e) {
                const data = JSON.parse(e.data);
                switch (data.cmd) {
                    case 'play_audio': startAudioSync(); break;
                    case 'pause_audio': stopAudioSync(); break;
                    case 'global_off': executeWithStinger(() => { turnOffOthers('none'); }); break;
                    
                    case 'trigger_next':
                        if (currentVideoPlaylist && currentVideoPlaylist.length > 0) {
                            currentVideoIndex++;
                            playNextVideoInList();
                        }
                        break;

                    // 🟢 Vid 1, 2, 3 பட்டன்களை அழுத்தும்போது வீடியோ ப்ளே ஆவதோடு Expand Mode தானாகவே நடக்கும்
                    case 'local_media':
                        isSingleLoop = true;
                        currentVideoPlaylist = [data.file];
                        currentVideoIndex = 0;
                        playNextVideoInList();
                        break;
                        
                    case 'playlist_trigger':
                        isSingleLoop = false;
                        currentVideoPlaylist = data.videos || [];
                        currentVideoIndex = 0;
                        playNextVideoInList();
                        break;

                    case 'pan_left':
                        if (panX > 0) { panX -= 10; updateMediaTransform(); }
                        break;
                    case 'pan_right':
                        if (panX < 100) { panX += 10; updateMediaTransform(); }
                        break;
                    case 'pan_up':
                        if (panY < 100) { panY += 10; updateMediaTransform(); }
                        break;
                    case 'pan_down':
                        if (panY > 0) { panY -= 10; updateMediaTransform(); }
                        break;
                    case 'zoom_in':
                        if (zoomLevel < 3) { zoomLevel += 0.2; updateMediaTransform(); }
                        break;
                    case 'zoom_out':
                        if (zoomLevel > 1) { zoomLevel -= 0.2; updateMediaTransform(); }
                        break;
                    case 'pan_center':
                        panX = 50; panY = 50; zoomLevel = 1; updateMediaTransform();
                        break;

                    case 'ticker_up':
                        topTickerY -= 20; updateTopTickerPosition();
                        break;
                    case 'ticker_down':
                        topTickerY += 20; updateTopTickerPosition();
                        break;
                    case 'ticker_reset':
                        topTickerY = 0; updateTopTickerPosition();
                        break;

                    case 'media_action':
                        if (data.action === 'mute_toggle') {
                            isMediaMuted = !isMediaMuted;
                            const v1 = document.getElementById("local-video-layer");
                            const v2 = document.getElementById("local-video-layer-buffer");
                            if (v1) v1.muted = isMediaMuted;
                            if (v2) v2.muted = isMediaMuted;
                        }
                        break;

                    case 'video2_action':
                        if (data.action === 'play_pause') {
                            if (!isVideo2Visible) {
                                let v2Url = "http://127.0.0.1:3000/Videos/" + data.file;
                                if (!v2Element.src.includes(encodeURI(data.file))) {
                                    v2Element.src = v2Url;
                                    v2Element.load();
                                    
                                    const handleV2Ready = () => {
                                        v2Element.oncanplay = null;
                                        executeWithStinger(() => {
                                            isVideo2Visible = true; turnOffOthers('video2');
                                            v2Element.style.visibility = "visible"; v2Element.style.opacity = "1"; 
                                            v2Element.play().catch(console.error);
                                        });
                                    };
                                    v2Element.oncanplay = handleV2Ready;
                                    setTimeout(() => { if(v2Element.oncanplay) handleV2Ready(); }, 1500);
                                } else {
                                    executeWithStinger(() => {
                                        isVideo2Visible = true; turnOffOthers('video2');
                                        v2Element.style.visibility = "visible"; v2Element.style.opacity = "1"; 
                                        v2Element.play().catch(console.error);
                                    });
                                }
                            } else {
                                v2Element.paused ? v2Element.play() : v2Element.pause();
                            }
                        } else if (data.action === 'mute_toggle') {
                            v2Element.muted = !v2Element.muted;
                        }
                        break;

                    // 🟢 அசல் EXPAND பட்டனுக்கான லாஜிக் இணைக்கப்பட்டது
                    case 'toggle_media_height':
                        executeWithStinger(() => {
                            const mainCont = document.querySelector('.main-container');
                            if(mainCont) {
                                mainCont.classList.toggle('expanded-mode');
                                const isExpanded = mainCont.classList.contains('expanded-mode');
                                
                                const tsOverlay = document.getElementById("ts-transition-overlay");
                                if (isExpanded) {
                                    if (breakingGifTimeout) clearTimeout(breakingGifTimeout);
                                    if (breakingGifInterval) clearInterval(breakingGifInterval);
                                    if(tsOverlay) tsOverlay.classList.remove("active");
                                } else {
                                    if (isTSVisible) startBreakingGifLoop();
                                }
                            }
                        });
                        break;
                        
                    case 'toggle_ts':
                        isTSVisible = !isTSVisible;
                        const tsOverlay = document.getElementById("ts-transition-overlay");
                        if (!isTSVisible) {
                            if(tsOverlay) tsOverlay.classList.remove("active");
                            if (breakingGifTimeout) clearTimeout(breakingGifTimeout);
                            if (breakingGifInterval) clearInterval(breakingGifInterval);
                        } else {
                            const mainCont = document.querySelector('.main-container');
                            if (!mainCont || !mainCont.classList.contains('expanded-mode')) {
                                startBreakingGifLoop();
                            }
                        }
                        break;
                        
                    case 'toggle_text':
                        executeWithStinger(() => {
                            isTextHidden = !isTextHidden; 
                            if (!isTextHidden) turnOffOthers('text');
                            const tOp = isTextHidden ? "0" : "1";
                            if (outputDiv) outputDiv.style.opacity = tOp;
                            if (mermaidDiv) mermaidDiv.style.opacity = tOp;
                            if (topCaseOverlay) topCaseOverlay.style.opacity = isTextHidden ? "0" : (topCaseOverlay.classList.contains("show-case") ? "1" : "0");
                        });
                        break;
                    case 'toggle_social':
                        executeWithStinger(() => {
                            isSliderVisible = !isSliderVisible;
                            if (isSliderVisible) {
                                turnOffOthers('slider');
                                if (validSliderImages.length === 0) loadAndInitSlider();
                                else { localSliderLayer.style.visibility = "visible"; localSliderLayer.style.opacity = "1"; }
                            } else {
                                if (localSliderLayer) { localSliderLayer.style.visibility = "hidden"; localSliderLayer.style.opacity = "0"; }
                            }
                        });
                        break;
                    case 'toggle_webrtc':
                        executeWithStinger(() => {
                            isWebrtcVisible = !isWebrtcVisible;
                            if (isWebrtcVisible) turnOffOthers('webrtc');
                            if (webrtcIframe) { 
                                webrtcIframe.style.visibility = isWebrtcVisible ? "visible" : "hidden"; 
                                webrtcIframe.style.opacity = isWebrtcVisible ? "1" : "0"; 
                                webrtcIframe.style.pointerEvents = isWebrtcVisible ? "auto" : "none"; 
                            }
                        });
                        break;
                    case 'toggle_cticker':
                        executeWithStinger(() => {
                            isCTickerVisible = !isCTickerVisible;
                            if (isCTickerVisible) turnOffOthers('cticker');
                            const cTickerLayer = document.getElementById("layer-text-slider");
                            if (cTickerLayer) { isCTickerVisible ? cTickerLayer.classList.add("active") : cTickerLayer.classList.remove("active"); }
                        });
                        break;
                    case 'toggle_bg_cover':
                        executeWithStinger(() => {
                            const bgLayer = document.getElementById("theme-bg-layer");
                            if (bgLayer) { bgLayer.classList.toggle("hide-bg"); }
                        });
                        break;
                    case 'toggle_location':
                        const locLayer = document.getElementById("location-ticker-container");
                        if (locLayer) { locLayer.classList.toggle("active"); }
                        break;
                }
            };
            evtSource.onerror = function(err) {
                console.error("SSE Connection lost. Attempting to reconnect...");
                evtSource.close(); setTimeout(connectSSE, 3000);
            };
        }
        connectSSE();

        function startAudioSync() {
            if (isStarted) return; isStarted = true;
            if (!myAudio.src) { myAudio.src = "http://127.0.0.1:3000/audio.mp3"; myAudio.load(); }
            if (!isAudioSetup) {
                const vContainer = document.getElementById('visualizer'); vContainer.innerHTML = ''; vBars = [];
                const numBars = 50; const startAngle = -135; const endAngle = 135; const step = (endAngle - startAngle) / (numBars - 1);
                for (let i = 0; i < numBars; i++) {
                    const b = document.createElement('div'); b.className = 'v-bar'; const angle = startAngle + (i * step); b.dataset.angle = angle;
                    b.style.transform = `rotate(${angle}deg) translateY(-${ARC_RADIUS}px)`; vContainer.appendChild(b); vBars.push(b);
                }
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)(); source = audioCtx.createMediaElementSource(myAudio);
                    analyser = audioCtx.createAnalyser(); source.connect(analyser); analyser.connect(audioCtx.destination);
                    analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.4; dataArray = new Uint8Array(analyser.frequencyBinCount); isAudioSetup = true; 
                } catch(e) { console.log(e); }
            }
            if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }

            const renderVisualizer = () => {
                if (!isStarted || !analyser) return; requestAnimationFrame(renderVisualizer); analyser.getByteFrequencyData(dataArray);
                const half = Math.floor(vBars.length / 2); let totalVolume = 0; const mappingRatio = Math.floor(analyser.frequencyBinCount / 2) / half; 
                vBars.forEach((bar, index) => {
                    let dIdx = (index < half) ? Math.floor((half - index) * mappingRatio) : Math.floor((index - half) * mappingRatio);
                    if(dIdx >= dataArray.length) dIdx = dataArray.length - 1; const val = dataArray[dIdx] || 0;
                    bar.style.transform = `rotate(${bar.dataset.angle}deg) translateY(-${ARC_RADIUS}px) scaleY(${1 + (val / 30)})`; totalVolume += val; 
                });
                const avgVol = totalVolume / vBars.length; const glowDiv = document.getElementById('justice-glow'); if (glowDiv) glowDiv.style.opacity = Math.min(0.9, avgVol / 120);
            };
            renderVisualizer(); myAudio.play();
        }   

       function stopAudioSync() { isStarted = false; if (myAudio && myAudio.src) { myAudio.pause(); } }
        
        function startAutoSocialBanner() {
            const socialBanner = document.getElementById("social-banner-overlay");
            if (!socialBanner) return;
            function triggerSocial() { socialBanner.classList.add("show-social"); setTimeout(() => { socialBanner.classList.remove("show-social"); }, 18000); }
            setTimeout(triggerSocial, 30000); setInterval(triggerSocial, 40000); 
        }
        window.addEventListener('load', startAutoSocialBanner);
   </script>
    
</body>
